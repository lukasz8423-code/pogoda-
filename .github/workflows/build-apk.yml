name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Clean generated Android web assets
        run: rm -rf android/app/src/main/assets/public

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Capacitor web assets
        run: test -s android/app/src/main/assets/public/index.html && grep -q 'assets/' android/app/src/main/assets/public/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PogodaLokalna-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

